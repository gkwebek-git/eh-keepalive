name: Admin ébren tartása

# A Render ingyenes tárhelye 15 perc tétlenség után elalszik. Ez a munkafolyamat 10 percenként "megböki" az admint,
# de csak nappal (UTC 4–20 óra = magyar idő szerint kb. 5–22 óra), hogy a Render havi ingyenes órakerete is elég legyen.
on:
  schedule:
    - cron: "*/10 4-20 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ébresztés
        run: curl -fsS -m 120 --retry 2 --retry-delay 5 -o /dev/null -w "%{http_code}\n" https://erdei-harmonia-admin.onrender.com/api/users/me
